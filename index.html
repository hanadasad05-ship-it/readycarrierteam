<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>READY CARRIER TEAM — Crew Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0f;
    --panel: #161818;
    --panel2: #1c1f1f;
    --border: #2a2e2e;
    --steel: #2e3535;
    --green: #2ecc71;
    --green-dim: #1a6638;
    --green-glow: rgba(46,204,113,0.15);
    --red: #e74c3c;
    --red-dim: #7a1e14;
    --amber: #f39c12;
    --amber-dim: #7a4e06;
    --text: #d4dada;
    --muted: #5a6464;
    --white: #f0f4f4;
    --accent: #f39c12;
  }

  body.light {
    --bg: #f0f2f2;
    --panel: #ffffff;
    --panel2: #e8ecec;
    --border: #d0d8d8;
    --steel: #c4cccc;
    --text: #2a3333;
    --muted: #7a9090;
    --white: #111818;
    --accent: #e07b00;
    --green-dim: #1a8040;
    --red-dim: #9a2a1e;
    --amber-dim: #8a5a06;
  }
  body.light header { box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
  body.light .history-table thead tr { background: var(--panel2); }
  body.light .crew-card { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  body.light .btn-clock.start { background: linear-gradient(135deg, #1f8040, #1a6030); }
  body.light .btn-clock.stop  { background: linear-gradient(135deg, #9a2a1e, #7a1e14); }

  .theme-toggle {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.3s, color 0.3s, background 0.3s;
    user-select: none;
    white-space: nowrap;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .theme-icon { font-size: 1rem; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.012) 39px, rgba(255,255,255,0.012) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.012) 39px, rgba(255,255,255,0.012) 40px);
  }

  /* HEADER */
  header {
    background: var(--panel);
    border-bottom: 2px solid var(--accent);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 32px rgba(0,0,0,0.6);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-icon {
    font-size: 2rem;
    line-height: 1;
  }
  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.7rem;
    letter-spacing: 0.1em;
    color: var(--white);
    line-height: 1;
  }
  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    color: var(--accent);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .live-clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.5rem;
    color: var(--white);
    letter-spacing: 0.08em;
  }
  .live-date {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-align: right;
    margin-top: 2px;
  }

  /* SUMMARY BAR */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .summary-card {
    background: var(--panel);
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    color: var(--white);
    line-height: 1;
  }
  .summary-val.green { color: var(--green); }
  .summary-val.red { color: var(--red); }
  .summary-val.amber { color: var(--amber); }
  .summary-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* MAIN LAYOUT */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px 64px;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* CREW GRID */
  .crew-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }

  /* CREW CARD */
  .crew-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative;
  }
  .crew-card.online {
    border-color: var(--green-dim);
    box-shadow: 0 0 24px rgba(46,204,113,0.08), inset 0 0 0 1px rgba(46,204,113,0.1);
  }
  .crew-card.online::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: scanLine 3s ease-in-out infinite;
  }
  @keyframes scanLine {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .card-header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--bg);
    flex-shrink: 0;
    position: relative;
  }
  .avatar.online::after {
    content: '';
    position: absolute;
    bottom: 1px; right: 1px;
    width: 12px; height: 12px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid var(--panel);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  .avatar.offline::after {
    content: '';
    position: absolute;
    bottom: 1px; right: 1px;
    width: 12px; height: 12px;
    background: var(--muted);
    border-radius: 50%;
    border: 2px solid var(--panel);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--green); }
    50% { box-shadow: 0 0 14px var(--green), 0 0 24px rgba(46,204,113,0.4); }
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--white);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-role {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    margin-top: 2px;
  }
  .status-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .status-badge.online {
    background: rgba(46,204,113,0.12);
    color: var(--green);
    border: 1px solid var(--green-dim);
  }
  .status-badge.offline {
    background: rgba(90,100,100,0.12);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .card-body {
    padding: 16px 20px;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .time-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .time-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .time-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    color: var(--text);
  }
  .time-value.highlight { color: var(--amber); }
  .time-value.green { color: var(--green); }

  .hours-display {
    margin: 14px 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hours-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .hours-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--white);
    letter-spacing: 0.05em;
  }
  .hours-value.active { color: var(--green); }

  /* Progress bar */
  .shift-progress {
    height: 4px;
    background: var(--steel);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .shift-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-dim), var(--green));
    border-radius: 2px;
    transition: width 1s linear;
  }

  /* BUTTONS */
  .card-footer {
    padding: 0 20px 20px;
  }
  .btn-clock {
    width: 100%;
    padding: 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-clock::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }
  .btn-clock:hover::after { background: rgba(255,255,255,0.07); }
  .btn-clock:active { transform: scale(0.98); }
  .btn-clock.start {
    background: linear-gradient(135deg, #1a5c30, var(--green-dim));
    color: var(--green);
    border: 1px solid var(--green-dim);
    box-shadow: 0 2px 16px rgba(46,204,113,0.1);
  }
  .btn-clock.start:hover {
    background: linear-gradient(135deg, #1f7a3d, #226b36);
    box-shadow: 0 4px 24px rgba(46,204,113,0.25);
  }
  .btn-clock.stop {
    background: linear-gradient(135deg, #5c1a14, var(--red-dim));
    color: var(--red);
    border: 1px solid var(--red-dim);
    box-shadow: 0 2px 16px rgba(231,76,60,0.1);
  }
  .btn-clock.stop:hover {
    background: linear-gradient(135deg, #7a221a, #6b2018);
    box-shadow: 0 4px 24px rgba(231,76,60,0.25);
  }

  /* HISTORY TABLE */
  .history-section {
    margin-top: 48px;
  }
  .history-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .history-table thead tr {
    background: var(--panel2);
    border-bottom: 2px solid var(--border);
  }
  .history-table th {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px;
    text-align: left;
  }
  .history-table td {
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .history-table tr:last-child td { border-bottom: none; }
  .history-table tr:hover td { background: rgba(255,255,255,0.02); }
  .td-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--white);
  }
  .td-mono {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
    color: var(--text);
  }
  .td-hours {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--amber);
  }
  .td-status-done {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    padding: 3px 8px;
    background: rgba(90,100,100,0.15);
    color: var(--muted);
    border-radius: 2px;
    display: inline-block;
  }
  .td-status-active {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    padding: 3px 8px;
    background: rgba(46,204,113,0.1);
    color: var(--green);
    border-radius: 2px;
    display: inline-block;
    border: 1px solid var(--green-dim);
  }

  .no-history {
    text-align: center;
    padding: 48px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 14px 20px;
    border-radius: 2px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text);
    z-index: 1000;
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(0); }
  .toast.red { border-left-color: var(--red); }

  /* Owner panel toggle */
  .owner-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 16px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    transition: border-color 0.3s, color 0.3s;
    user-select: none;
  }
  .owner-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .owner-toggle .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
  }

  /* EDIT MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 4px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    transform: translateY(20px);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white);
  }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal-body { padding: 20px 24px; }
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .edit-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
  .edit-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .edit-input {
    flex: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.05em;
    color: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }
  .edit-input:focus { border-color: var(--accent); }
  .edit-input::placeholder { color: var(--muted); font-weight: 400; }
  .modal-footer {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .btn-save {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #7a4e06, var(--amber-dim));
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    padding: 10px 28px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save:hover { background: linear-gradient(135deg, #8a5a08, #9a6410); box-shadow: 0 4px 16px rgba(243,156,18,0.2); }
  .btn-cancel {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .edit-toggle {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.3s, color 0.3s;
    user-select: none;
    white-space: nowrap;
  }
  .edit-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* Responsive */
  @media (max-width: 700px) {
    header { padding: 0 16px; }
    main { padding: 0 16px 48px; }
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .crew-grid { grid-template-columns: 1fr; }
    .live-date { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">🚛</div>
    <div>
      <div class="logo-text">READY CARRIER TEAM</div>
      <div class="logo-sub">Crew Tracker System</div>
    </div>
  </div>
  <div class="header-right">
    <div>
      <div class="live-clock" id="liveClock">00:00:00</div>
      <div class="live-date" id="liveDate">—</div>
    </div>
    <div class="edit-toggle" id="editToggle">
      ✏️ <span>Edit Names</span>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <span class="theme-icon" id="themeIcon">☀️</span>
      <span id="themeLabel">Light Mode</span>
    </div>
    <div class="owner-toggle" id="ownerToggle">
      <div class="dot"></div>
      <span id="ownerLabel">Owner View: OFF</span>
    </div>
  </div>
</header>

<!-- SUMMARY BAR -->
<div class="summary-bar">
  <div class="summary-card">
    <div class="summary-val" id="sumTotal">14</div>
    <div class="summary-label">Total Crew</div>
  </div>
  <div class="summary-card">
    <div class="summary-val green" id="sumOnline">0</div>
    <div class="summary-label">🟢 On Shift</div>
  </div>
  <div class="summary-card">
    <div class="summary-val red" id="sumOffline">14</div>
    <div class="summary-label">⚫ Off Duty</div>
  </div>
  <div class="summary-card">
    <div class="summary-val amber" id="sumHours">0h 0m</div>
    <div class="summary-label">Total Hours Today</div>
  </div>
</div>

<!-- MAIN -->
<main>
  <div class="section-title">Active Crew</div>
  <div class="crew-grid" id="crewGrid"></div>

  <div class="history-section" id="historySection">
    <div class="section-title">Shift Log — Today</div>
    <table class="history-table">
      <thead>
        <tr>
          <th>Driver</th>
          <th>Clock In</th>
          <th>Clock Out</th>
          <th>Hours Worked</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="5" class="no-history">No shifts logged yet today.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- EDIT NAMES MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">✏️ &nbsp;Edit Team Names</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-save" id="modalSave">💾 &nbsp;Save Names</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== CREW DATA =====
const CREW = [
  { id: 1,  name: 'Ziraaj',        role: 'Driver',  color: '#f39c12', initials: 'ZR' },
  { id: 2,  name: 'Abdullahi',     role: 'Driver',  color: '#2ecc71', initials: 'AB' },
  { id: 3,  name: 'Abdulrahman',   role: 'Driver',  color: '#3498db', initials: 'AR' },
  { id: 4,  name: 'Tasha',         role: 'Driver',  color: '#e74c3c', initials: 'TA' },
  { id: 5,  name: 'Andy',          role: 'Driver',  color: '#9b59b6', initials: 'AN' },
  { id: 6,  name: 'Mohamed Don',   role: 'Driver',  color: '#1abc9c', initials: 'MD' },
  { id: 7,  name: 'Cusmaan',       role: 'Driver',  color: '#e67e22', initials: 'CU' },
  { id: 8,  name: 'Nuurkei',       role: 'Driver',  color: '#e91e8c', initials: 'NK' },
  { id: 9,  name: 'Asad',          role: 'Driver',  color: '#00bcd4', initials: 'AS' },
  { id: 10, name: 'Team Member 10',role: 'Driver',  color: '#607d8b', initials: '—' },
  { id: 11, name: 'Team Member 11',role: 'Driver',  color: '#607d8b', initials: '—' },
  { id: 12, name: 'Team Member 12',role: 'Driver',  color: '#607d8b', initials: '—' },
  { id: 13, name: 'Team Member 13',role: 'Driver',  color: '#607d8b', initials: '—' },
  { id: 14, name: 'Team Member 14',role: 'Driver',  color: '#607d8b', initials: '—' },
];

const STORAGE_KEY = 'rigboss_v2';
const today = new Date().toDateString();

// ===== STATE =====
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return initState();
    const s = JSON.parse(raw);
    // Reset if new day
    if (s.date !== today) return initState();
    return s;
  } catch { return initState(); }
}
function initState() {
  return {
    date: today,
    crew: CREW.map(c => ({ id: c.id, online: false, clockIn: null, clockOut: null, totalMs: 0 })),
    history: []
  };
}
function saveState(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

let state = loadState();
let ownerView = false;
let liveTimers = {};

// ===== CLOCK =====
function tick() {
  const now = new Date();
  document.getElementById('liveClock').textContent =
    now.toLocaleTimeString('en-US', { hour12: false });
  document.getElementById('liveDate').textContent =
    now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  // Update live timers
  state.crew.forEach(c => {
    if (c.online && c.clockIn) {
      const el = document.getElementById(`hours-${c.id}`);
      if (el) el.textContent = fmtElapsed(Date.now() - c.clockIn);
    }
  });
  updateSummary();
}
setInterval(tick, 1000);
tick();

// ===== FORMAT =====
function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
}
function fmtElapsed(ms) {
  if (!ms || ms < 0) return '0h 00m';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}
function fmtElapsedShort(ms) {
  if (!ms || ms < 0) return '0h 00m';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return `${h}h ${String(m).padStart(2,'0')}m`;
}

// ===== CREW CARDS =====
function renderCards() {
  const grid = document.getElementById('crewGrid');
  grid.innerHTML = '';
  CREW.forEach(crew => {
    const cs = state.crew.find(c => c.id === crew.id);
    const online = cs.online;
    const elapsed = online && cs.clockIn ? Date.now() - cs.clockIn : cs.totalMs;
    const maxShift = 10 * 3600000;
    const progress = Math.min((elapsed / maxShift) * 100, 100);

    const card = document.createElement('div');
    card.className = `crew-card ${online ? 'online' : 'offline'}`;
    card.id = `card-${crew.id}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="avatar ${online ? 'online' : 'offline'}" style="background: ${crew.color}20; border: 2px solid ${crew.color}40; color: ${crew.color};">
          ${crew.initials}
        </div>
        <div class="card-info">
          <div class="card-name">${crew.name}</div>
          <div class="card-role">${crew.role}</div>
        </div>
        <div class="status-badge ${online ? 'online' : 'offline'}">${online ? '● ON' : '○ OFF'}</div>
      </div>
      <div class="card-body">
        <div class="time-row">
          <div class="time-item">
            <span class="time-label">Clock In</span>
            <span class="time-value ${online ? 'green' : ''}">${fmtTime(cs.clockIn)}</span>
          </div>
          <div class="time-item" style="text-align:right;">
            <span class="time-label">Clock Out</span>
            <span class="time-value">${fmtTime(cs.clockOut)}</span>
          </div>
        </div>
        <div class="shift-progress">
          <div class="shift-progress-fill" style="width: ${online ? progress : (cs.totalMs ? Math.min((cs.totalMs/maxShift)*100,100) : 0)}%"></div>
        </div>
        <div class="hours-display">
          <span class="hours-label">⏱ Hours Worked</span>
          <span class="hours-value ${online ? 'active' : ''}" id="hours-${crew.id}">${fmtElapsed(elapsed)}</span>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-clock ${online ? 'stop' : 'start'}" onclick="toggleShift(${crew.id})">
          ${online ? '■ &nbsp;CLOCK OUT' : '▶ &nbsp;CLOCK IN'}
        </button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ===== TOGGLE SHIFT =====
function toggleShift(id) {
  const cs = state.crew.find(c => c.id === id);
  const crew = CREW.find(c => c.id === id);
  const now = Date.now();

  if (!cs.online) {
    // Clock IN
    cs.online = true;
    cs.clockIn = now;
    cs.clockOut = null;
    showToast(`▶ ${crew.name} clocked IN at ${fmtTime(now)}`, false);
  } else {
    // Clock OUT
    const worked = now - cs.clockIn;
    cs.totalMs += worked;
    cs.online = false;
    cs.clockOut = now;
    // Add to history
    state.history.push({
      name: crew.name,
      role: crew.role,
      clockIn: cs.clockIn,
      clockOut: now,
      ms: worked
    });
    showToast(`■ ${crew.name} clocked OUT — ${fmtElapsedShort(cs.totalMs)} total`, true);
  }

  saveState(state);
  renderCards();
  renderHistory();
  updateSummary();
}

// ===== SUMMARY =====
function updateSummary() {
  const online = state.crew.filter(c => c.online).length;
  document.getElementById('sumOnline').textContent = online;
  document.getElementById('sumOffline').textContent = CREW.length - online;
  // Total hours today (completed + active)
  let totalMs = 0;
  state.crew.forEach(c => {
    totalMs += c.totalMs;
    if (c.online && c.clockIn) totalMs += Date.now() - c.clockIn;
  });
  document.getElementById('sumHours').textContent = fmtElapsedShort(totalMs);
}

// ===== HISTORY =====
function renderHistory() {
  const tbody = document.getElementById('historyBody');
  // Gather: completed shifts from history + active shifts
  const rows = [...state.history];
  // Add active ones
  state.crew.filter(c => c.online && c.clockIn).forEach(c => {
    const crew = CREW.find(cr => cr.id === c.id);
    rows.push({ name: crew.name, role: crew.role, clockIn: c.clockIn, clockOut: null, ms: Date.now() - c.clockIn, active: true });
  });

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-history">No shifts logged yet today.</td></tr>`;
    return;
  }

  // Sort by clockIn desc
  rows.sort((a, b) => b.clockIn - a.clockIn);

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>
        <div class="td-name">${r.name}</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:0.6rem;color:var(--muted);margin-top:2px;">${r.role}</div>
      </td>
      <td class="td-mono">${fmtTime(r.clockIn)}</td>
      <td class="td-mono">${r.clockOut ? fmtTime(r.clockOut) : '<span style="color:var(--green);font-family:\'Share Tech Mono\',monospace;font-size:0.75rem;">● ACTIVE</span>'}</td>
      <td class="td-hours">${r.active ? fmtElapsedShort(r.ms) : fmtElapsedShort(r.ms)}</td>
      <td>${r.active ? '<span class="td-status-active">On Shift</span>' : '<span class="td-status-done">Complete</span>'}</td>
    </tr>
  `).join('');
}

// ===== TOAST =====
let toastTimer;
function showToast(msg, isStop) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${isStop ? 'red' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ===== OWNER VIEW =====
document.getElementById('ownerToggle').addEventListener('click', () => {
  ownerView = !ownerView;
  document.getElementById('ownerLabel').textContent = `Owner View: ${ownerView ? 'ON' : 'OFF'}`;
  document.getElementById('historySection').style.display = ownerView ? 'block' : 'none';
});

// ===== THEME TOGGLE =====
let isLight = localStorage.getItem('rct_theme') === 'light';
function applyTheme() {
  document.body.classList.toggle('light', isLight);
  document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
  document.getElementById('themeLabel').textContent = isLight ? 'Dark Mode' : 'Light Mode';
}
applyTheme();
document.getElementById('themeToggle').addEventListener('click', () => {
  isLight = !isLight;
  localStorage.setItem('rct_theme', isLight ? 'light' : 'dark');
  applyTheme();
});

// ===== EDIT NAMES =====
const NAMES_KEY = 'rct_names';
function loadCustomNames() {
  try {
    const raw = localStorage.getItem(NAMES_KEY);
    if (!raw) return;
    const names = JSON.parse(raw);
    names.forEach(({ id, name }) => {
      const c = CREW.find(cr => cr.id === id);
      if (c && name.trim()) {
        c.name = name.trim();
        c.initials = name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      }
    });
  } catch {}
}
loadCustomNames();

function openEditModal() {
  const body = document.getElementById('editModalBody');
  body.innerHTML = CREW.map(c => `
    <div class="edit-row">
      <span class="edit-num">${c.id}</span>
      <div class="edit-avatar" style="background:${c.color}20;border:2px solid ${c.color}40;color:${c.color};">${c.initials}</div>
      <input class="edit-input" data-id="${c.id}" value="${c.name}" placeholder="Enter name..." maxlength="30" />
    </div>
  `).join('');
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
}
function saveNames() {
  const inputs = document.querySelectorAll('.edit-input');
  const names = [];
  inputs.forEach(inp => {
    const id = parseInt(inp.dataset.id);
    const name = inp.value.trim();
    if (name) {
      names.push({ id, name });
      const c = CREW.find(cr => cr.id === id);
      if (c) {
        c.name = name;
        c.initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      }
    }
  });
  localStorage.setItem(NAMES_KEY, JSON.stringify(names));
  closeEditModal();
  renderCards();
  renderHistory();
  showToast('✅ Team names saved!', false);
}
document.getElementById('editToggle').addEventListener('click', openEditModal);
document.getElementById('modalClose').addEventListener('click', closeEditModal);
document.getElementById('modalCancel').addEventListener('click', closeEditModal);
document.getElementById('modalSave').addEventListener('click', saveNames);
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeEditModal();
});

// ===== INIT =====
renderCards();
renderHistory();
updateSummary();
document.getElementById('historySection').style.display = 'none'; // hidden by default
</script>
</body>
</html>
